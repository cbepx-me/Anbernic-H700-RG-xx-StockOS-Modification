<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ _('Anbernic game management') }}</title>
    <style>
        * { box-sizing: border-box; }
        body { margin:0; font-family: sans-serif; display:flex; height:100vh; background:#1e1e2e; color:#cdd6f4; }
        #sidebar { width:40%; background:#181825; overflow-y:auto; border-right:2px solid #313244; display:flex; flex-direction:column; }
        #toolbar { padding:10px; background:#313244; border-bottom:1px solid #45475a; display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
        #toolbar select, #toolbar button { background:#45475a; color:#cdd6f4; border:1px solid #585b70; padding:6px 12px; border-radius:6px; cursor:pointer; }
        #toolbar button:hover { background:#585b70; }
        #toolbar .btn-danger { background:#f38ba8; color:#1e1e2e; }
        #toolbar button:disabled { opacity:0.5; cursor:not-allowed; }
        #device-info {
            padding: 4px 12px;
            background: #313244;
            border-bottom: 1px solid #45475a;
            font-size: 0.95em;
            color: #a6adc8;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #search-bar { padding:5px 10px 3px 10px; background:#181825; border-bottom:1px solid #313244; }
        #search-input { width:100%; background:#45475a; color:#cdd6f4; border:1px solid #585b70; padding:6px 12px; border-radius:6px; outline:none; }
        #search-input:focus { border-color:#89b4fa; }
        #search-input:disabled { opacity:0.5; }
        #search-result { padding:3px 10px 5px 10px; background:#181825; color:#a6adc8; font-size:0.85em; border-bottom:1px solid #313244; }
        #game-list { flex:1; overflow-y:auto; padding:5px; }
        .dir-item, .file-item { padding:8px 12px; cursor:pointer; border-bottom:1px solid #313244; display:flex; justify-content:space-between; }
        .dir-item:hover, .file-item:hover { background:#313244; }
        .dir-item.active, .file-item.active { background:#89b4fa; color:#1e1e2e; }
        .console-tag { font-size:0.7em; background:#45475a; padding:2px 8px; border-radius:10px; }
        .file-size { color:#a6adc8; font-size:0.8em; }
        #main { flex:1; display:flex; flex-direction:column; padding:20px; overflow-y:auto; }
        #preview-container { flex:1; display:flex; justify-content:center; align-items:center; background:#11111b; border-radius:12px; min-height:300px; margin-bottom:15px; }
        #preview-img { max-width:100%; max-height:400px; border-radius:8px; object-fit:contain; }
        #detail { background:#181825; padding:15px; border-radius:12px; border:1px solid #313244; }
        .btn { background:#89b4fa; color:#1e1e2e; border:none; padding:8px 18px; border-radius:6px; cursor:pointer; margin-right:8px; font-weight:bold; }
        .btn-danger { background:#f38ba8; color:#1e1e2e; }
        .btn-secondary { background:#45475a; color:#cdd6f4; }
        .flex-row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:5px 0; }
        input[type="file"] { background:#313244; color:#cdd6f4; border:1px solid #585b70; padding:4px; border-radius:4px; }
        #upload-status { margin-left:10px; color:#a6e3a1; }
        #upload-progress { margin-top:10px; color:#a6e3a1; font-size:0.9em; display:none; }
        .info-line { margin:4px 0; }
        #breadcrumb { color:#a6adc8; font-size:0.9em; margin-left:10px; cursor:pointer; }
        #breadcrumb:hover { text-decoration:underline; }
        #storage-info {
            padding: 10px 15px;
            background: #313244;
            border-top: 1px solid #45475a;
            font-size: 0.85em;
            color: #a6adc8;
            flex-shrink: 0;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        #storage-info .sd-label {
            font-weight: bold;
            color: #89b4fa;
        }
    </style>
</head>
<body>
<div id="sidebar">
    <div id="device-info">{{ _('Loading device info...') }}</div>
    <div id="toolbar">
        <select id="sd-select">
            <option value="1" selected>SD1</option>
            <option value="2">SD2</option>
        </select>
        <button onclick="loadDirs()">{{ _('Refresh') }}</button>
        <button onclick="showUpload()" class="btn-secondary">{{ _('Upload game') }}</button>
        <button onclick="shutdownServer()" class="btn-danger">{{ _('Shutdown server') }}</button>
        <span id="breadcrumb"></span>
    </div>
    <div id="search-bar">
        <input type="text" id="search-input" placeholder="{{ _('Search...') }}" oninput="filterItems(this.value)">
    </div>
    <div id="search-result"></div>
    <div id="game-list"></div>
    <div id="storage-info">{{ _('Loading storage info...') }}</div>
</div>
<div id="main">
    <div id="preview-container">
        <img id="preview-img" src="" alt="{{ _('Preview') }}" style="display:none;">
        <div id="no-preview" style="color:#6c7086;">{{ _('No preview') }}</div>
    </div>
    <div id="detail">
        <div id="detail-content">{{ _('Select a game') }}</div>
        <div style="margin-top:12px; display:flex; gap:10px; flex-wrap:wrap;">
            <button class="btn btn-danger" onclick="deleteCurrent()">{{ _('Delete game') }}</button>
            <button class="btn btn-secondary" onclick="document.getElementById('update-preview-input').click();">{{ _('Update preview') }}</button>
            <input type="file" id="update-preview-input" accept="image/*" style="display:none;" onchange="updatePreview()">
        </div>
    </div>
</div>
<div id="upload-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); justify-content:center; align-items:center; z-index:1000;">
    <div style="background:#1e1e2e; padding:30px; border-radius:16px; min-width:300px; border:1px solid #45475a;">
        <h3>{{ _('Upload game') }}</h3>
        <div class="flex-row"><label>{{ _('Target directory:') }} <input id="upload-console" placeholder="{{ _('e.g. GBA') }}" style="background:#313244;color:#cdd6f4;border:1px solid #585b70;padding:4px;border-radius:4px;"></label></div>
        <div class="flex-row"><label>{{ _('ROM file:') }} <input type="file" id="upload-rom" multiple style="background:#313244;color:#cdd6f4;border:1px solid #585b70;padding:4px;border-radius:4px;"></label></div>
        <div class="flex-row"><label>{{ _('Preview:') }} <input type="file" id="upload-preview" multiple accept="image/*" style="background:#313244;color:#cdd6f4;border:1px solid #585b70;padding:4px;border-radius:4px;"></label></div>
        <div style="margin-top:15px; display:flex; gap:10px;">
            <button class="btn" onclick="doUpload()">{{ _('Upload') }}</button>
            <button class="btn-secondary" onclick="closeUpload()">{{ _('Cancel') }}</button>
            <span id="upload-status"></span>
        </div>
        <div id="upload-progress"></div>
    </div>
</div>

<script>
// 翻译字典
var lang = {
    total_items: {{ _('Total {count} items')|tojson }},
    found_items: {{ _('Found {count} items')|tojson }},
    delete_confirm: {{ _('Delete "{name}" and its preview?')|tojson }},
    deleted_success: {{ _('Deleted successfully')|tojson }},
    delete_failed: {{ _('Delete failed: {error}')|tojson }},
    unknown_error: {{ _('Unknown error')|tojson }},
    select_game_first: {{ _('Please select a game first')|tojson }},
    preview_updated: {{ _('Preview updated successfully!')|tojson }},
    update_failed: {{ _('Update failed: {error}')|tojson }},
    select_rom: {{ _('Please select at least one ROM file')|tojson }},
    enter_target_dir: {{ _('Please enter target directory')|tojson }},
    uploading: {{ _('Uploading...')|tojson }},
    success: {{ _('Success')|tojson }},
    failed: {{ _('Failed: {error}')|tojson }},
    network_error: {{ _('Network error')|tojson }},
    storage_load_failed: {{ _('Failed to load storage info')|tojson }},
    storage_unavailable: {{ _('Storage info unavailable')|tojson }},
    device_unavailable: {{ _('Device info unavailable')|tojson }},
    shutdown_confirm: {{ _('Shutdown server?')|tojson }},
    server_shutting_down: {{ _('Server shutting down')|tojson }},
    server_stopped: {{ _('Server stopped')|tojson }},
    device_info_template: {{ _('⭐ Anbernic game management | 🕹️ Model: {board} | ⚙️ Firmware: {version}')|tojson }},
    // 新增翻译键
    preparing_upload: {{ _('Preparing to upload {count} files...')|tojson }},
    upload_complete: {{ _('Upload completed!')|tojson }},
    parse_error: {{ _('Failed to parse response')|tojson }},
    by: {{ _('By')|tojson }}
};

var currentPath = '';
var currentItems = [];
var currentFile = null;
var currentSd = 1;

function getSd() { return document.getElementById('sd-select').value; }

function loadDirs() {
    var sd = getSd();
    fetch('/api/sd', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({sd: parseInt(sd)})
    })
    .then(function(response) { return response.json(); })
    .then(function(data) {
        if (data.status === 'ok') {
            currentSd = data.sd;
            updateStorageInfo();
            updateDeviceInfo();
            fetch('/api/dirs')
            .then(function(response) { return response.json(); })
            .then(function(dirs) {
                var list = document.getElementById('game-list');
                list.innerHTML = '';
                currentPath = '';
                currentFile = null;
                document.getElementById('breadcrumb').textContent = '';
                document.getElementById('search-input').value = '';
                document.getElementById('search-result').textContent = '';
                clearDetail();
                document.getElementById('preview-img').style.display = 'none';
                document.getElementById('no-preview').style.display = 'block';
                for (var i = 0; i < dirs.length; i++) {
                    var dir = dirs[i];
                    var div = document.createElement('div');
                    div.className = 'dir-item';
                    div.textContent = dir.name + (dir.has_games ? ' [☆]' : '');
                    div.dataset.path = dir.path;
                    div.onclick = (function(d) { return function() { enterDir(d.path); }; })(dir);
                    list.appendChild(div);
                }
                currentItems = [];
            })
            .catch(function(err) { console.error('dirs error', err); });
        }
    })
    .catch(function(err) { console.error('sd error', err); });
}

function enterDir(path) {
    currentPath = path || '';
    if (currentPath === '') {
        document.getElementById('breadcrumb').textContent = '';
    } else {
        var displayPath = currentPath.replace(/\//g, ' / ');
        document.getElementById('breadcrumb').textContent = '📁 ' + displayPath + ' ({{ _("Back to parent") }})';
        document.getElementById('breadcrumb').onclick = function() {
            if (currentPath.includes('/')) {
                var parent = currentPath.substring(0, currentPath.lastIndexOf('/'));
                enterDir(parent);
            } else {
                loadDirs();
            }
        };
    }
    document.getElementById('search-input').value = '';
    document.getElementById('search-result').textContent = '';
    fetch('/api/files?dir=' + encodeURIComponent(currentPath))
    .then(function(response) { return response.json(); })
    .then(function(items) {
        currentItems = items;
        renderItems(items);
        clearDetail();
        document.getElementById('preview-img').style.display = 'none';
        document.getElementById('no-preview').style.display = 'block';
    })
    .catch(function(err) { console.error('files error', err); });
}

function renderItems(items) {
    var list = document.getElementById('game-list');
    list.innerHTML = '';
    if (currentPath !== '') {
        var backDiv = document.createElement('div');
        backDiv.className = 'dir-item';
        backDiv.textContent = '⬆ {{ _("Back to parent") }}';
        backDiv.style.background = '#313244';
        backDiv.onclick = function() {
            if (currentPath.includes('/')) {
                var parent = currentPath.substring(0, currentPath.lastIndexOf('/'));
                enterDir(parent);
            } else {
                loadDirs();
            }
        };
        list.appendChild(backDiv);
    }
    for (var i = 0; i < items.length; i++) {
        var item = items[i];
        var div = document.createElement('div');
        div.className = item.is_dir ? 'dir-item' : 'file-item';
        if (item.is_dir) {
            var nameSpan = document.createElement('span');
            nameSpan.textContent = '📁 ' + item.name;
            div.appendChild(nameSpan);
            div.onclick = (function(it) { return function() { enterDir(it.path); }; })(item);
        } else {
            var nameSpan = document.createElement('span');
            nameSpan.textContent = item.name;
            var tagSpan = document.createElement('span');
            tagSpan.className = 'console-tag';
            tagSpan.textContent = item.console;
            var sizeSpan = document.createElement('span');
            sizeSpan.className = 'file-size';
            sizeSpan.textContent = (item.size / 1024).toFixed(1) + 'KB';
            div.appendChild(nameSpan);
            div.appendChild(tagSpan);
            div.appendChild(sizeSpan);
            div.dataset.path = item.path;
            div.onclick = (function(f) { return function() { selectFile(f); }; })(item);
        }
        list.appendChild(div);
    }
    var searchInput = document.getElementById('search-input');
    var countEl = document.getElementById('search-result');
    var count = items.length;
    if (searchInput.value.trim() === '') {
        countEl.textContent = lang.total_items.replace('{count}', count);
    } else {
        countEl.textContent = lang.found_items.replace('{count}', count);
    }
}

function filterItems(query) {
    if (!currentItems) return;
    var q = query.toLowerCase();
    var filtered = currentItems.filter(function(item) {
        return item.name.toLowerCase().includes(q) || (item.console && item.console.toLowerCase().includes(q));
    });
    renderItems(filtered);
}

function selectFile(file) {
    currentFile = file;
    var items = document.querySelectorAll('.file-item');
    for (var i = 0; i < items.length; i++) {
        items[i].classList.remove('active');
    }
    var activeItems = document.querySelectorAll('.file-item[data-path="' + file.path + '"]');
    if (activeItems.length > 0) {
        activeItems[0].classList.add('active');
    }

    var img = document.getElementById('preview-img');
    var noPrev = document.getElementById('no-preview');
    if (file.preview) {
        img.src = '/api/preview?path=' + encodeURIComponent(file.path) + '&t=' + Date.now();
        img.style.display = 'block';
        noPrev.style.display = 'none';
    } else {
        img.style.display = 'none';
        noPrev.style.display = 'block';
    }

    var detail = document.getElementById('detail-content');
    detail.innerHTML = '';
    var lines = [
        { label: '', value: file.name, strong: true },
        { label: '{{ _("Platform: ") }}', value: file.console },
        { label: '{{ _("Size: ") }}', value: (file.size / (1024*1024)).toFixed(2) + ' MB' },
        { label: '{{ _("Modified: ") }}', value: new Date(file.modified * 1000).toLocaleString() },
        { label: '{{ _("Path: ") }}', value: file.path }
    ];
    for (var i = 0; i < lines.length; i++) {
        var line = lines[i];
        var div = document.createElement('div');
        div.className = 'info-line';
        if (line.strong) {
            var strong = document.createElement('strong');
            strong.textContent = line.value;
            div.appendChild(strong);
        } else {
            div.textContent = line.label + line.value;
        }
        detail.appendChild(div);
    }
}

function clearDetail() {
    document.getElementById('detail-content').textContent = '{{ _("Select a game") }}';
    document.getElementById('preview-img').style.display = 'none';
    document.getElementById('no-preview').style.display = 'block';
}

function deleteCurrent() {
    if (!currentFile) return;
    if (!confirm(lang.delete_confirm.replace('{name}', currentFile.name))) return;
    fetch('/api/game?path=' + encodeURIComponent(currentFile.path), { method: 'DELETE' })
    .then(function(response) { return response.json(); })
    .then(function(data) {
        if (data.success) {
            alert(lang.deleted_success);
            currentFile = null;
            clearDetail();
            enterDir(currentPath);
        } else {
            alert(lang.delete_failed.replace('{error}', data.error || lang.unknown_error));
        }
    });
}

function updatePreview() {
    var fileInput = document.getElementById('update-preview-input');
    var file = fileInput.files[0];
    if (!file) return;
    if (!currentFile) {
        alert(lang.select_game_first);
        fileInput.value = '';
        return;
    }

    var formData = new FormData();
    formData.append('path', currentFile.path);
    formData.append('image', file);

    var btn = document.querySelector('#detail .btn-secondary');
    var originalText = btn.textContent;
    btn.textContent = lang.uploading;
    btn.disabled = true;

    fetch('/api/update_preview', { method: 'POST', body: formData })
    .then(function(response) { return response.json(); })
    .then(function(data) {
        if (data.success) {
            alert(lang.preview_updated);
            currentFile.preview = data.preview_path;
            selectFile(currentFile);
        } else {
            alert(lang.update_failed.replace('{error}', data.error));
        }
        btn.textContent = originalText;
        btn.disabled = false;
        fileInput.value = '';
    })
    .catch(function(err) {
        alert(lang.network_error);
        btn.textContent = originalText;
        btn.disabled = false;
        fileInput.value = '';
    });
}

function showUpload() {
    document.getElementById('upload-modal').style.display = 'flex';
    document.getElementById('upload-status').textContent = '';
    document.getElementById('upload-progress').style.display = 'none';
    if (currentPath) {
        document.getElementById('upload-console').value = currentPath;
    }
}

function closeUpload() {
    document.getElementById('upload-modal').style.display = 'none';
}

function doUpload() {
    var consoleInput = document.getElementById('upload-console').value.trim();
    var romFiles = document.getElementById('upload-rom').files;
    var previewFiles = document.getElementById('upload-preview').files;

    if (romFiles.length === 0) { alert(lang.select_rom); return; }
    if (!consoleInput) { alert(lang.enter_target_dir); return; }

    var formData = new FormData();
    formData.append('console', consoleInput);
    for (var i = 0; i < romFiles.length; i++) {
        formData.append('game_files', romFiles[i]);
    }
    for (var i = 0; i < previewFiles.length; i++) {
        formData.append('preview_file', previewFiles[i]);
    }

    var status = document.getElementById('upload-status');
    var progress = document.getElementById('upload-progress');
    progress.style.display = 'block';
    progress.textContent = lang.preparing_upload.replace('{count}', romFiles.length);
    status.textContent = lang.uploading;

    disableUI(true);

    var xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/upload', true);

    xhr.upload.onprogress = function(e) {
        if (e.lengthComputable) {
            var percent = Math.round((e.loaded / e.total) * 100);
            progress.textContent = lang.uploading + ' ' + percent + '% (' + romFiles.length + ' {{ _("ROM files") }})';
        } else {
            progress.textContent = lang.uploading + '... (' + e.loaded + ' {{ _("bytes") }})';
        }
    };

    xhr.onload = function() {
        if (xhr.status === 200) {
            try {
                var response = JSON.parse(xhr.responseText);
                if (response.success) {
                    status.textContent = lang.success + ' (' + response.count + ' {{ _("files") }})';
                    progress.textContent = lang.upload_complete;
                    setTimeout(function() {
                        closeUpload();
                        enterDir(currentPath);
                        disableUI(false);
                        progress.style.display = 'none';
                    }, 1500);
                } else {
                    status.textContent = lang.failed.replace('{error}', response.error || '');
                    progress.textContent = '';
                    disableUI(false);
                }
            } catch (e) {
                status.textContent = lang.parse_error;
                progress.textContent = '';
                disableUI(false);
            }
        } else {
            status.textContent = lang.failed.replace('{error}', 'HTTP ' + xhr.status);
            progress.textContent = '';
            disableUI(false);
        }
    };

    xhr.onerror = function() {
        status.textContent = lang.network_error;
        progress.textContent = '';
        disableUI(false);
    };

    xhr.send(formData);
}

function disableUI(disabled) {
    var elements = document.querySelectorAll('#toolbar select, #toolbar button, #search-input');
    for (var i = 0; i < elements.length; i++) {
        elements[i].disabled = disabled;
    }
}

function updateStorageInfo() {
    fetch('/api/storage')
    .then(function(response) { return response.json(); })
    .then(function(data) {
        if (data.error) {
            document.getElementById('storage-info').innerHTML = lang.storage_load_failed;
            return;
        }
        var totalGB = (data.total / (1024*1024*1024)).toFixed(1);
        var usedGB = (data.used / (1024*1024*1024)).toFixed(1);
        var freeGB = (data.free / (1024*1024*1024)).toFixed(1);
        var percent = (data.used / data.total * 100).toFixed(0);
        document.getElementById('storage-info').innerHTML = 
            '<span class="sd-label">💾 SD' + currentSd + '</span> | ' +
            '📀 {{ _("Capacity") }}: ' + totalGB + ' GB | 📲 {{ _("Used") }}: ' + usedGB + ' GB (' + percent + '%) | 📦 {{ _("Free") }}: ' + freeGB + ' GB | 📝 ' + lang.by + ' G.R.H';
    })
    .catch(function(err) {
        document.getElementById('storage-info').textContent = lang.storage_unavailable;
    });
}

function updateDeviceInfo() {
    fetch('/api/device_info')
    .then(function(response) { return response.json(); })
    .then(function(data) {
        var version = data.system_version || '{{ _("Unknown") }}';
        var author = data.author || 'G.R.H';
        document.getElementById('device-info').innerHTML =
            lang.device_info_template
            .replace('{board}', data.board)
            .replace('{version}', version) + ' | ✍️ ' + author;
    })
    .catch(function(err) {
        document.getElementById('device-info').textContent = lang.device_unavailable;
    });
}

function shutdownServer() {
    if (confirm(lang.shutdown_confirm)) {
        fetch('/shutdown', { method: 'GET' })
        .then(function(response) { return response.text(); })
        .then(function(text) {
            alert(lang.server_shutting_down);
            document.body.innerHTML = '';
            document.body.style.margin = '0';
            document.body.style.padding = '0';
            document.body.style.display = 'flex';
            document.body.style.justifyContent = 'center';
            document.body.style.alignItems = 'center';
            document.body.style.height = '100vh';
            document.body.style.background = '#1e1e2e';
            document.body.style.color = '#cdd6f4';
            document.body.style.fontFamily = 'sans-serif';
            document.body.style.fontSize = '2rem';
            document.body.textContent = lang.server_stopped;
        })
        .catch(function() {
            document.body.innerHTML = '';
            document.body.style.margin = '0';
            document.body.style.padding = '0';
            document.body.style.display = 'flex';
            document.body.style.justifyContent = 'center';
            document.body.style.alignItems = 'center';
            document.body.style.height = '100vh';
            document.body.style.background = '#1e1e2e';
            document.body.style.color = '#cdd6f4';
            document.body.style.fontFamily = 'sans-serif';
            document.body.style.fontSize = '2rem';
            document.body.textContent = lang.server_stopped;
        });
    }
}

document.getElementById('sd-select').addEventListener('change', loadDirs);
loadDirs();
</script>
</body>
</html>
